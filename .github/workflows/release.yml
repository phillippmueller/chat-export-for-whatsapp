name: Release

# Publishes a GitHub release with the skill packaged as a ZIP, ready to upload
# under Customize -> Skills. Run it from the Actions tab ("Run workflow"); it
# creates the tag v<version> from the plugin's plugin.json. Pushing a v* tag
# also works.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Work out the version
        run: |
          version="$(jq -r .version plugins/chat-export-for-whatsapp/.claude-plugin/plugin.json)"
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin.json version $version" >&2
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Package the skill
        run: |
          mkdir -p dist
          (cd plugins/chat-export-for-whatsapp/skills && zip -r -X ../../../dist/chat-export-for-whatsapp-skill.zip whatsapp-export -x '*/__pycache__/*' '*.pyc')
          unzip -l dist/chat-export-for-whatsapp-skill.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; raise the version in plugin.json first." >&2
            exit 1
          fi
          notes="$(awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)"
          gh release create "$TAG" dist/chat-export-for-whatsapp-skill.zip \
            --target "$GITHUB_SHA" --title "$TAG" --notes "${notes:-See CHANGELOG.md}"
